<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Block Planner</title>
  <style>
    :root{--ink:#172033;--muted:#7b8494;--line:#e8ebf0;--soft:#f7f8fa;--accent:#5669e8;--accent-soft:#eef0ff;--shadow:0 16px 50px rgba(34,47,74,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff,#fafbff 48%,#f3f5ff);color:var(--ink);font-family:Inter,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}.app{width:min(1160px,calc(100% - 40px));margin:auto;padding:32px 0}.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;min-height:190px;padding:35px 38px;margin-bottom:22px;border-radius:26px;background:linear-gradient(125deg,#87CEEB,#1E3F66);color:#fff;box-shadow:var(--shadow)}.hero>*:not(.aurora){position:relative;z-index:2}.aurora{position:absolute;inset:-35%;z-index:1;filter:blur(42px);opacity:.8}.blob{position:absolute;width:45%;aspect-ratio:1;border-radius:42% 58% 62% 38% / 42% 38% 62% 58%;mix-blend-mode:screen;animation:float 13s ease-in-out infinite alternate}.blob.green{background:radial-gradient(circle at 35% 35%,#A7DA20,transparent 68%);left:4%;top:12%;animation-duration:12s}.blob.red{background:radial-gradient(circle at 50% 50%,#EB0029,transparent 68%);right:4%;bottom:5%;animation-delay:-5s}.blob.gold{background:radial-gradient(circle at 40% 40%,#FFD700,transparent 68%);left:35%;top:8%;animation-duration:15s;animation-delay:-9s}@keyframes float{0%{transform:translate(-8%,-5%) rotate(0deg) scale(.9);border-radius:42% 58% 62% 38% / 42% 38% 62% 58%}50%{transform:translate(22%,12%) rotate(110deg) scale(1.13);border-radius:64% 36% 44% 56% / 58% 62% 38% 42%}100%{transform:translate(-2%,27%) rotate(220deg) scale(.96);border-radius:38% 62% 55% 45% / 48% 36% 64% 52%}}.eyebrow{margin:0 0 9px;color:#fff;font-size:.73rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,4vw,3.25rem);letter-spacing:-.055em;line-height:1;text-shadow:0 2px 16px rgba(10,40,75,.22)}.subtitle{max-width:420px;margin:0;color:rgba(255,255,255,.92);font-size:.93rem;line-height:1.65;text-shadow:0 1px 10px rgba(10,40,75,.25)}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:stretch;height:calc(100vh - 276px);min-height:460px}.card{background:rgba(255,255,255,.9);border:1px solid rgba(229,233,240,.9);border-radius:22px;box-shadow:var(--shadow)}.controls{padding:25px;overflow-y:auto}h2{margin:0;font-size:1.08rem;letter-spacing:-.025em}.hint{color:var(--muted);font-size:.8rem;line-height:1.55;margin:8px 0 20px}.field{display:grid;gap:7px;margin-top:14px}label{color:#566070;font-size:.76rem;font-weight:700}input,select,button{font:inherit}select,input[type="number"],.batch-input{width:100%;height:43px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;color:var(--ink);outline:none;transition:.2s}select:focus,input:focus{border-color:#9ba6f3;box-shadow:0 0 0 4px var(--accent-soft)}button{border:0;border-radius:11px;cursor:pointer;font-weight:750;transition:transform .15s,background .15s}button:hover{transform:translateY(-1px)}.primary{width:100%;margin-top:22px;height:46px;color:#fff;background:var(--accent);box-shadow:0 8px 18px rgba(86,105,232,.23)}.primary:hover{background:#4558d8}.content{overflow:hidden;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.toolbar p{margin:4px 0 0;color:var(--muted);font-size:.78rem}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.secondary{padding:9px 11px;font-size:.75rem;color:#47536a;background:var(--soft)}.secondary:hover{background:#eef0f4}.batch{display:none;gap:8px;align-items:center;padding:13px 20px;background:#fbfbff;border-bottom:1px solid var(--line)}.batch.show{display:flex}.batch-input{width:auto;flex:1;height:38px}.batch .secondary{white-space:nowrap}.schedule-wrap{overflow:auto;flex:1}table{width:100%;border-collapse:collapse;min-width:570px}th{text-align:left;height:43px;padding:0 16px;background:#fcfcfd;border-bottom:1px solid var(--line);color:#8991a0;font-size:.69rem;letter-spacing:.08em;text-transform:uppercase;position:sticky;top:0;z-index:1}th:first-child{width:42px}th:nth-child(2){width:165px}td{height:57px;padding:0 16px;border-bottom:1px solid #f0f2f5}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfcff}.time{display:flex;align-items:center;gap:10px;color:#39445a;font-variant-numeric:tabular-nums;font-size:.84rem;font-weight:700;white-space:nowrap}.dot{display:block;width:7px;height:7px;border-radius:99px;background:#b8c0d0}.work .dot{background:var(--accent)}.break .dot{background:#9babc0}.check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}.task{width:100%;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:8px;color:var(--ink);font-size:.9rem;outline:none;transition:.15s}.task::placeholder{color:#b4bac5}.task:hover{background:#f7f8fc}.task:focus{border-color:#cdd3fa;background:#fff;box-shadow:0 0 0 3px #f0f2ff}.empty{padding:68px 24px;text-align:center;color:var(--muted);font-size:.9rem}.footer{padding:14px 20px;color:#a1a8b4;font-size:.72rem;border-top:1px solid var(--line)}@media(max-width:780px){.app{width:min(100% - 28px,620px);padding:20px 0 40px}.hero,.layout{display:block;height:auto;min-height:0}.hero{padding:32px 25px;margin-bottom:18px}.subtitle{margin-top:18px}.controls{margin-bottom:17px;overflow:visible}.content{display:block}.schedule-wrap{overflow-x:auto}.toolbar{align-items:flex-start}.batch{align-items:stretch;flex-wrap:wrap}.batch-input{width:100%;flex:auto}}@media(max-width:470px){.app{width:calc(100% - 20px)}.controls{padding:20px}.toolbar{padding:16px}.actions{gap:5px}.secondary{padding:8px}}
    .metadata{display:flex;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fcfcff}.metadata label{display:grid;gap:4px;flex:1}.metadata input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 9px;color:var(--ink);background:#fff}.metadata input[type="date"]{min-width:135px}.metadata input:focus{outline:none;border-color:#9ba6f3;box-shadow:0 0 0 3px var(--accent-soft)}
    .timer-panel{margin-top:22px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;overflow:hidden;position:relative;background:linear-gradient(135deg,#B8DEF1,#003466);color:#fff}.timer-panel>*{position:relative;z-index:1}.timer-panel:before{content:"";position:absolute;width:230px;height:230px;border-radius:55% 45% 55% 45%;background:#B2B0B1;filter:blur(40px);opacity:.5;right:12%;top:-70px;animation:timerBlob 12s ease-in-out infinite alternate}.timer-panel:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#B8DEF1;filter:blur(42px);opacity:.32;left:25%;bottom:-80px;animation:timerBlob 14s ease-in-out infinite alternate-reverse}@keyframes timerBlob{to{transform:translate(65px,38px) rotate(120deg);border-radius:42% 58% 38% 62%}}.timer-copy h2{font-size:1.25rem}.timer-copy p{margin:7px 0 18px;color:rgba(255,255,255,.85);font-size:.84rem}.timer-presets{display:flex;gap:8px}.timer-presets button{padding:9px 13px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff}.timer-presets button.active{background:#fff;color:#174879}.timer-ring{--progress:0deg;width:230px;height:230px;border-radius:50%;padding:10px;background:conic-gradient(#fff var(--progress),rgba(255,255,255,.22) 0);box-shadow:0 12px 35px rgba(0,22,57,.28)}.timer-inner{width:100%;height:100%;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 35% 30%,#568bb0,#003466 72%);box-shadow:inset 0 0 35px rgba(255,255,255,.14)}#timerText{font-size:2.65rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.06em;cursor:pointer}#timerText:hover{opacity:.82}.timer-inputs{display:flex;align-items:center;gap:4px;font-size:1.5rem;font-weight:800}.timer-inputs input{width:66px!important;height:48px!important;padding:0 6px!important;border:1px solid rgba(255,255,255,.7)!important;border-radius:9px!important;background:rgba(0,35,76,.65)!important;color:#fff!important;text-align:center;font-size:1.4rem!important;font-weight:800}.timer-inputs[hidden]{display:none}.timer-actions{display:flex;gap:8px;margin-top:14px;justify-content:center}.timer-actions button{padding:8px 12px;background:#fff;color:#174879}.timer-actions .timer-max{background:rgba(255,255,255,.17);color:#fff;border:1px solid rgba(255,255,255,.3)}.timer-actions .timer-stop{background:#d73955;color:#fff}.timer-stop[hidden]{display:none}.timer-panel.fullscreen{position:fixed;z-index:20;inset:0;margin:0;border-radius:0;display:grid;place-content:center;grid-template-columns:1fr;min-height:100vh;text-align:center}.timer-panel.fullscreen .timer-copy{display:grid;justify-items:center;gap:14px}.timer-panel.fullscreen .timer-ring{width:min(65vw,500px);height:min(65vw,500px);margin:auto}.timer-panel.fullscreen #timerText{font-size:clamp(3rem,10vw,7rem)}
    body.dark{--ink:#edf1f8;--muted:#aab4c4;--line:#303a4e;--soft:#222c3d;--accent-soft:#273151;background:linear-gradient(135deg,#121827,#1a2232 48%,#101723)}body.dark .card{background:rgba(27,35,50,.94);border-color:#334057;box-shadow:0 16px 50px rgba(0,0,0,.25)}body.dark .toolbar,body.dark .metadata,body.dark th{background:#1d2636;border-color:#303a4e}body.dark .metadata input,body.dark select,body.dark input[type="number"],body.dark input[type="text"]{background:#151d2a;color:var(--ink);border-color:#3a4559}body.dark label,body.dark .time{color:#ccd5e5}body.dark .secondary{background:#263247;color:#d8e0ec}body.dark .secondary:hover,body.dark tbody tr:hover{background:#303d55}body.dark td,body.dark th,body.dark .batch,body.dark .footer{border-color:#303a4e}body.dark .batch{background:#1b2434}body.dark .task{color:var(--ink)}body.dark .task:hover{background:#202b3d}body.dark .task:focus{background:#172033}body.dark .footer{color:#8995a8}
    @media print{body{background:#fff}.app{width:100%;padding:0}header,.controls,.toolbar,.batch,.footer{display:none}.metadata{border:0;padding:0 0 10px}.card{box-shadow:none;border:0}.layout{display:block}table{min-width:0}.check,th:first-child,td:first-child{display:none}}
  </style>
</head>
<body>
  <main class="app" id="planner">
    <header class="hero"><div class="aurora" aria-hidden="true"><span class="blob green"></span><span class="blob red"></span><span class="blob gold"></span></div><div><p class="eyebrow">Daily focus</p><h1>Time Block Planner</h1></div><p class="subtitle">決めた時間に、ひとつずつ。タスクを入力して、今日の集中時間を軽やかに整理しましょう。</p></header>
    <section class="layout"><aside class="card controls"><h2>スケジュールを生成</h2><p class="hint">追加する種類と時間範囲を選び、重なりがないか確認してから表へ追加します。</p>
      <div class="field"><label for="addType">追加するもの</label><select id="addType"><option value="work">作業</option><option value="break">休憩</option></select></div><div class="field"><label for="start">開始時刻</label><select id="start"></select></div><div class="field"><label for="end">終了時刻</label><select id="end"></select></div><div class="session-only"><div class="field"><label for="pattern">作業セッション</label><select id="pattern"><option value="25">25分 作業 ＋ 5分 休憩</option><option value="50">50分 作業 ＋ 10分 休憩</option></select></div></div><button class="primary" id="generate">表に追加する</button></aside>
      <section class="card content"><div class="toolbar"><div><h2 id="scheduleTitle">定番のタイムブロック</h2><p id="scheduleNote">チェックした複数の枠にも、同じタスクを入力できます。</p></div><div class="actions"><button class="secondary" id="theme">ダークモード</button><button class="secondary" id="save">保存</button><button class="secondary" id="png">PNG出力</button><button class="secondary" id="clear">入力を消去</button><button class="secondary" id="allClear">表をクリア</button><button class="secondary" id="restore">定番に戻す</button></div></div><div class="metadata"><label>日付<input id="blockDate" type="date"></label><label>名前<input id="blockName" type="text" maxlength="60" placeholder="例：朝の集中時間"></label></div>
        <div class="batch" id="batch"><input class="batch-input" id="batchTask" placeholder="選択した枠に入力するタスク"><button class="secondary" id="applyBatch">一括入力</button><button class="secondary" id="unselect">選択解除</button></div><div class="schedule-wrap"><table><thead><tr><th><input class="check" id="selectAll" type="checkbox" aria-label="すべて選択"></th><th>時間</th><th>タスク</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer">入力内容はこのブラウザに自動保存されます。</div></section>
    </section><section class="card timer-panel" id="timerPanel"><div class="timer-copy"><h2>Focus Timer</h2><p>気持ちよく一区切り。中央の時間表示をクリックすると、分と秒を入力できます。</p><div class="timer-presets"><button data-minutes="5">5分</button><button data-minutes="10">10分</button><button class="active" data-minutes="25">25分</button><button data-minutes="50">50分</button><button id="timerCustom">カスタム</button></div></div><div class="timer-ring" id="timerRing"><div class="timer-inner"><div id="timerText" role="button" tabindex="0" title="クリックして時間を入力">25:00</div><div class="timer-inputs" id="timerInputs" hidden><input id="timerMinutesInput" type="number" min="0" max="999" inputmode="numeric" aria-label="分"><span>:</span><input id="timerSecondsInput" type="number" min="0" max="59" inputmode="numeric" aria-label="秒"></div><div class="timer-actions"><button id="timerStart">開始</button><button id="timerReset">リセット</button><button class="timer-max" id="timerMax">最大化</button><button class="timer-stop" id="timerStop" hidden>音を止める</button></div></div></div></section><audio id="timerAlarm" src="timer-alarm.mp3" preload="auto"></audio>
  </main>
  <script>
    const defaults=['07:00~07:25','07:30~07:55','08:00~08:25','08:30~08:55','09:00~09:25','09:30~09:55','10:00~10:25','10:30~10:55','11:00~11:25','11:30~11:55','11:55~13:00','13:00~13:25','13:30~13:55','14:00~14:25','14:30~14:55','15:00~15:25','15:30~15:55','16:00~16:25','16:30~16:55','17:00~17:25','17:30~17:55','18:00~18:25','18:30~18:55','18:55~20:00','20:00~20:25','20:30~20:55','21:00~21:25','21:30~21:55','22:00~22:25','22:30~22:55'];
    const stateKey='time-block-planner-v3'; let selected=new Set();
    const today=()=>new Date().toISOString().slice(0,10), defaultSchedule=()=>({date:today(),name:'',slots:defaults.map(time=>({time,kind:time==='11:55~13:00'||time==='18:55~20:00'?'break':'work',task:time==='11:55~13:00'||time==='18:55~20:00'?'休憩':''}))});
    let schedule=JSON.parse(localStorage.getItem(stateKey)||'null')||defaultSchedule();schedule.date??=today();schedule.name??='';
    const rows=document.getElementById('rows'),title=document.getElementById('scheduleTitle'),note=document.getElementById('scheduleNote'),batch=document.getElementById('batch');
    const pad=n=>String(n).padStart(2,'0'), display=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`, toMinutes=t=>{const [h,m]=t.split(':').map(Number);return h*60+m}, range=s=>{const [a,b]=s.time.split('~');return [toMinutes(a),toMinutes(b)]};
    const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); const save=()=>localStorage.setItem(stateKey,JSON.stringify(schedule));
    function render(){const isDefault=schedule.slots.map(s=>s.time).join('|')===defaults.join('|');title.textContent=isDefault?'定番のタイムブロック':'タイムブロック';note.textContent='チェックした複数の枠にも、同じタスクを入力できます。';batch.classList.toggle('show',selected.size>0);document.getElementById('selectAll').checked=schedule.slots.length>0&&selected.size===schedule.slots.length;document.getElementById('selectAll').disabled=!schedule.slots.length;rows.innerHTML=schedule.slots.length?schedule.slots.map((s,i)=>`<tr class="${s.kind}"><td><input class="check row-check" data-index="${i}" type="checkbox" ${selected.has(i)?'checked':''} aria-label="${s.time}を選択"></td><td><span class="time"><i class="dot"></i>${s.time}</span></td><td><input class="task" data-index="${i}" value="${esc(s.task)}" placeholder="ここにタスクを入力"></td></tr>`).join(''):'<tr><td colspan="3" class="empty">時間枠を追加してください。</td></tr>';rows.querySelectorAll('.task').forEach(el=>el.addEventListener('input',e=>{schedule.slots[+e.target.dataset.index].task=e.target.value;save()}));rows.querySelectorAll('.row-check').forEach(el=>el.addEventListener('change',e=>{const i=+e.target.dataset.index;e.target.checked?selected.add(i):selected.delete(i);render()}));}
    function fillTimes(){['start','end'].forEach(id=>{const select=document.getElementById(id);for(let m=0;m<1440;m+=5){const t=display(m);select.add(new Option(t,t))}});document.getElementById('start').value='07:00';document.getElementById('end').value='07:30'}
    function sortSlots(){schedule.slots.sort((a,b)=>range(a)[0]-range(b)[0])}
    function addSlots(added){const overlaps=schedule.slots.filter(old=>added.some(next=>{const [a,b]=range(old),[c,d]=range(next);return a<d&&c<b}));if(overlaps.length){const useNew=confirm(`既存の${overlaps.length}件と時刻が重なっています。\n「OK」: 既存の枠を置き換えて追加\n「キャンセル」: 既存の枠を残して追加しない`);if(!useNew)return;schedule.slots=schedule.slots.filter(old=>!overlaps.includes(old))}schedule.slots.push(...added);sortSlots();selected.clear();save();render()}
    function generate(){const type=document.getElementById('addType').value,start=toMinutes(document.getElementById('start').value),end=toMinutes(document.getElementById('end').value);if(end<=start){alert('終了時刻は開始時刻より後にしてください。');return}if(type==='break'){addSlots([{time:`${display(start)}~${display(end)}`,kind:'break',task:'休憩'}]);return}let current=start,focus=+document.getElementById('pattern').value,shortRest=focus===25?5:10,added=[];while(current+focus<=end){added.push({time:`${display(current)}~${display(current+focus)}`,kind:'work',task:''});current+=focus;if(current+shortRest+focus<=end){added.push({time:`${display(current)}~${display(current+shortRest)}`,kind:'break',task:'休憩'});current+=shortRest}else break}if(!added.length){alert('指定した時間範囲には、選択した作業セッションが収まりません。');return}addSlots(added)}
    function clearTasks(){if(confirm('すべてのタスク入力を消去します。よろしいですか？')){schedule.slots.forEach(s=>s.task='');save();render()}}
    function allClear(){if(confirm('表のすべての時間枠とタスクを消去します。よろしいですか？')){schedule={date:schedule.date,name:schedule.name,slots:[]};selected.clear();save();render()}}
    function restore(){if(confirm('現在の表を定番のタイムブロックに戻します。追加した時間枠と入力内容は消去されます。よろしいですか？')){schedule=defaultSchedule();selected.clear();save();render()}}
    function applyBatch(){const value=document.getElementById('batchTask').value;if(!selected.size)return;selected.forEach(i=>schedule.slots[i].task=value);save();document.getElementById('batchTask').value='';render()}
    const filename=()=>`${(schedule.date||today()).replaceAll('-','')}-${(schedule.name||'タイムブロック').replace(/[\\/:*?"<>|]/g,'_')}`;
    function exportPng(){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),w=1200,row=68,h=155+schedule.slots.length*row;canvas.width=w*2;canvas.height=h*2;ctx.scale(2,2);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#172033';ctx.font='bold 34px sans-serif';ctx.fillText(schedule.name||title.textContent,55,60);ctx.fillStyle='#7b8494';ctx.font='20px sans-serif';ctx.fillText(`${schedule.date}  |  Time Block Planner`,55,94);schedule.slots.forEach((s,i)=>{const y=125+i*row;ctx.fillStyle=i%2?'#fcfcff':'#fff';ctx.fillRect(35,y,w-70,row);ctx.strokeStyle='#e8ebf0';ctx.beginPath();ctx.moveTo(35,y+row);ctx.lineTo(w-35,y+row);ctx.stroke();ctx.fillStyle=s.kind==='work'?'#5669e8':'#9babc0';ctx.beginPath();ctx.arc(67,y+34,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#39445a';ctx.font='bold 19px sans-serif';ctx.fillText(s.time,85,y+40);ctx.fillStyle='#172033';ctx.font='20px sans-serif';ctx.fillText(s.task||'—',310,y+40)});const a=document.createElement('a');a.download=`${filename()}.png`;a.href=canvas.toDataURL('image/png');a.click()}
    function saveFile(){const a=document.createElement('a');a.download=`${filename()}.json`;a.href=URL.createObjectURL(new Blob([JSON.stringify(schedule,null,2)],{type:'application/json'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
    const themeButton=document.getElementById('theme');function setTheme(dark){document.body.classList.toggle('dark',dark);themeButton.textContent=dark?'ライトモード':'ダークモード';localStorage.setItem('time-block-planner-theme',dark?'dark':'light')}setTheme(localStorage.getItem('time-block-planner-theme')==='dark');themeButton.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));document.getElementById('blockDate').value=schedule.date;document.getElementById('blockName').value=schedule.name;['blockDate','blockName'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{schedule[id==='blockDate'?'date':'name']=e.target.value;save()}));document.getElementById('addType').addEventListener('change',e=>{document.querySelectorAll('.session-only').forEach(el=>el.hidden=e.target.value==='break')});document.getElementById('generate').addEventListener('click',generate);document.getElementById('clear').addEventListener('click',clearTasks);document.getElementById('allClear').addEventListener('click',allClear);document.getElementById('restore').addEventListener('click',restore);document.getElementById('applyBatch').addEventListener('click',applyBatch);document.getElementById('unselect').addEventListener('click',()=>{selected.clear();render()});document.getElementById('selectAll').addEventListener('change',e=>{selected=e.target.checked?new Set(schedule.slots.map((_,i)=>i)):new Set();render()});document.getElementById('save').addEventListener('click',saveFile);document.getElementById('png').addEventListener('click',exportPng);
    let timerMinutes=25,timerLeft=1500,timerId=null,timerEnd=0;const timerRing=document.getElementById('timerRing'),timerText=document.getElementById('timerText'),timerStart=document.getElementById('timerStart'),timerInputs=document.getElementById('timerInputs'),minutesInput=document.getElementById('timerMinutesInput'),secondsInput=document.getElementById('timerSecondsInput'),alarm=document.getElementById('timerAlarm'),timerStop=document.getElementById('timerStop');function paintTimer(exact=timerLeft){const shown=Math.max(0,Math.ceil(exact)),m=Math.floor(shown/60),s=shown%60;timerText.textContent=`${pad(m)}:${pad(s)}`;timerRing.style.setProperty('--progress',`${360*Math.max(0,exact)/(timerMinutes*60)}deg`)}function stopAlarm(){alarm.pause();alarm.currentTime=0;timerStop.hidden=true}function stopTimer(){if(timerId){timerLeft=Math.max(0,(timerEnd-performance.now())/1000);cancelAnimationFrame(timerId);timerId=null}timerStart.textContent='開始'}function animateTimer(){const exact=(timerEnd-performance.now())/1000;if(exact<=0){timerLeft=0;paintTimer(0);timerId=null;timerStart.textContent='開始';alarm.currentTime=0;alarm.play().then(()=>timerStop.hidden=false).catch(()=>alert('タイマーが終了しました。'));return}timerLeft=exact;paintTimer(exact);timerId=requestAnimationFrame(animateTimer)}function chooseTimer(minutes){stopTimer();stopAlarm();timerMinutes=minutes;timerLeft=minutes*60;document.querySelectorAll('[data-minutes]').forEach(b=>b.classList.toggle('active',+b.dataset.minutes===minutes));paintTimer()}function openTimerInput(){stopTimer();const seconds=Math.max(0,Math.ceil(timerLeft));minutesInput.value=Math.floor(seconds/60);secondsInput.value=seconds%60;timerText.hidden=true;timerInputs.hidden=false;minutesInput.focus();minutesInput.select()}function setCustomTimer(){const total=Math.max(1,Math.min(59999,(+minutesInput.value||0)*60+Math.min(59,Math.max(0,+secondsInput.value||0))));timerInputs.hidden=true;timerText.hidden=false;stopAlarm();timerMinutes=total/60;timerLeft=total;document.querySelectorAll('[data-minutes]').forEach(b=>b.classList.remove('active'));paintTimer()}document.querySelectorAll('[data-minutes]').forEach(b=>b.addEventListener('click',()=>chooseTimer(+b.dataset.minutes)));document.getElementById('timerCustom').addEventListener('click',openTimerInput);timerText.addEventListener('click',openTimerInput);timerText.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTimerInput()}});[minutesInput,secondsInput].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')setCustomTimer();if(e.key==='Escape'){timerInputs.hidden=true;timerText.hidden=false}}));timerInputs.addEventListener('focusout',()=>setTimeout(()=>{if(!timerInputs.contains(document.activeElement)&&!timerInputs.hidden)setCustomTimer()},0));timerStart.addEventListener('click',()=>{if(timerId){stopTimer()}else if(timerLeft>0){timerEnd=performance.now()+timerLeft*1000;timerStart.textContent='一時停止';timerId=requestAnimationFrame(animateTimer)}});document.getElementById('timerReset').addEventListener('click',()=>chooseTimer(timerMinutes));timerStop.addEventListener('click',stopAlarm);document.getElementById('timerMax').addEventListener('click',()=>{const panel=document.getElementById('timerPanel');panel.classList.toggle('fullscreen');document.getElementById('timerMax').textContent=panel.classList.contains('fullscreen')?'戻る':'最大化'});paintTimer();fillTimes();sortSlots();render();
  </script>
